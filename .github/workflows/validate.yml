name: Validate playbook

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Validate playbook + slim packs
        run: python scripts/validate_playbook.py
      - name: Regenerate packs (drift check)
        run: |
          python scripts/generate_slim_packs.py
          git diff --exit-code -- references/playbook-packs
